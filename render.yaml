# Render Blueprint — deploys both services from this repo in one go.
#
# Usage: Render dashboard → New → Blueprint → connect this repo → Apply.
# Render reads this file automatically. After the first deploy, you still
# need to do two manual steps (Render doesn't know these values ahead of
# time — see README.md § Deployment for the full walkthrough):
#   1. Set GROQ_API_KEY (or ANTHROPIC_API_KEY) on the API service.
#   2. Once you have both services' URLs, set ALLOWED_ORIGINS on the API
#      service to the UI's URL, and VITE_API_BASE on the UI service (as a
#      build-time env var) to the API's URL, then redeploy the UI so the
#      new build picks it up.
#
# Render's Blueprint schema has changed over the years — if `render apply`
# or the dashboard rejects a field below, check Render's current Blueprint
# reference (render.com/docs/blueprint-spec) and adjust; the manual
# dashboard walkthrough in the README works regardless of this file.

services:
  - type: web
    name: senus-board-report-api
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: senus-board-report-ui
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html